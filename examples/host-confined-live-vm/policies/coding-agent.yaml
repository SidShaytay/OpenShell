version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /bin
    - /etc
    - /lib
    - /opt
    - /proc
    - /usr
    - /home/agent/.ssh
  read_write:
    - /dev/null
    - /dev/ptmx
    - /dev/pts
    - /home/agent
    - /tmp
    - /workspace
    - /sandbox

landlock:
  compatibility: best_effort

network_policies:
  local_model:
    endpoints:
      - { host: llama-swap.home.shaytay.com, port: 9998, protocol: tcp }
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/bin/curl }
      - { path: /usr/bin/codex }
      - { path: /usr/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin/codex }
  github_ssh:
    endpoints:
      - { host: github.com, port: 22, protocol: tcp }
    binaries:
      - { path: /usr/bin/git }
      - { path: /usr/bin/ssh }
      - { path: /usr/bin/gh }
  web_search:
    endpoints:
      - { host: mcp.exa.ai, port: 443, protocol: tcp }
      - { host: html.duckduckgo.com, port: 443, protocol: tcp }
      - { host: r.jina.ai, port: 443, protocol: tcp }
    binaries:
      - { path: /usr/bin/node }
  npm_packages:
    endpoints:
      - { host: registry.npmjs.org, port: 443, protocol: tcp }
    binaries:
      - { path: /usr/local/bin/bun }
      - { path: /usr/bin/npm }
      - { path: /usr/bin/node }
